name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            rust-targets: x86_64-pc-windows-msvc
          - platform: macos-universal
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Check tag and application versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Expected a release tag like v1.2.3; got $env:GITHUB_REF_NAME"
          }

          $releaseVersion = $Matches.version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargoText, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value

          if ($packageVersion -ne $releaseVersion -or $tauriVersion -ne $releaseVersion -or $cargoVersion -ne $releaseVersion) {
            throw "Tag $env:GITHUB_REF_NAME must match package.json ($packageVersion), tauri.conf.json ($tauriVersion), and Cargo.toml ($cargoVersion)"
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Test drag-and-drop classification
        run: node --test scripts/check-dragdrop.ts

      - name: Test Rust library
        shell: pwsh
        run: |
          Push-Location src-tauri
          cargo test --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build Windows installers
        if: matrix.platform == 'windows-x64'
        run: pnpm tauri build

      - name: Build universal macOS disk image
        if: matrix.platform == 'macos-universal'
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Stage release files
        shell: pwsh
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $stage = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $assets = @()

          if ($env:RELEASE_PLATFORM -eq 'windows-x64') {
            $assets += @{ Source = 'src-tauri/target/release/memory-card.exe'; Name = 'memory-card.exe' }
            $assets += @{ Source = "src-tauri/target/release/bundle/msi/memory-card_${version}_x64_en-US.msi"; Name = "memory-card_${version}_x64_en-US.msi" }
            $assets += @{ Source = "src-tauri/target/release/bundle/nsis/memory-card_${version}_x64-setup.exe"; Name = "memory-card_${version}_x64-setup.exe" }
          } else {
            $dmgDirectory = 'src-tauri/target/universal-apple-darwin/release/bundle/dmg'
            $dmg = Get-ChildItem -Path $dmgDirectory -Filter '*.dmg' -File | Select-Object -First 1
            if (-not $dmg) { throw "No DMG was produced in $dmgDirectory" }
            $assets += @{ Source = $dmg.FullName; Name = "memory-card_${version}_universal.dmg" }
          }

          foreach ($asset in $assets) {
            if (-not (Test-Path $asset.Source -PathType Leaf)) { throw "Missing release file: $($asset.Source)" }
            Copy-Item $asset.Source (Join-Path $stage $asset.Name)
          }

      - name: Upload platform build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Include MIT license
        run: cp LICENSE release-assets/LICENSE

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'LICENSE' ! -name 'SHA256SUMS.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: memory-card ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Windows packages are unsigned. The universal macOS DMG is not signed or notarized, so macOS Gatekeeper may show a security warning on first launch.
          files: |
            release-assets/*
          fail_on_unmatched_files: true